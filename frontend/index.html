<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/shifa-icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/shifa-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/shifa-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شفاء — نظام إدارة المنشآت الصحية</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('alshifa_theme') || localStorage.getItem('cms_theme');
          if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
          if (t) {
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
