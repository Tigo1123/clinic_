server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:ClinicTLS:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  resolver 127.0.0.11 valid=5s ipv6=off;
  set $backend_upstream backend:5000;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "healthy\n";
  }

  location /api/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /socket.io/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Internal-only health endpoint for the container healthcheck. It is not
# published and cannot serve the application or API to LAN clients.
server {
  listen 127.0.0.1:8080;
  server_name _;
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "healthy\n";
  }
  location / { return 404; }
}
