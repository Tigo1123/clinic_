services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cms-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      DATABASE_URL: file:/data/clinic.db
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - clinic-db:/data
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cms-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:5000
      VITE_SOCKET_URL: http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clinic-db:
  uploads-data:
