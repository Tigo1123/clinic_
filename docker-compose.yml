services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cms-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      CLINIC_TIME_ZONE: ${CLINIC_TIME_ZONE:?CLINIC_TIME_ZONE is required}
      PORT: 5000
      DATABASE_URL: file:/data/clinic.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MEDICAL_ENCRYPTION_KEY: ${MEDICAL_ENCRYPTION_KEY:?MEDICAL_ENCRYPTION_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      VERIFICATION_PROVIDER: ${VERIFICATION_PROVIDER:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFICATIONS_DISABLED: ${NOTIFICATIONS_DISABLED:-false}
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: "true"
    volumes:
      - clinic-db:/data
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CLINIC_TIME_ZONE: ${CLINIC_TIME_ZONE:?CLINIC_TIME_ZONE is required}
    container_name: cms-frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clinic-db:
  uploads-data:
