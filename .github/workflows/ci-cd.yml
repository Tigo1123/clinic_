name: Clinic Management System CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Lint and Test Backend
        env:
          DATABASE_URL: file:./ci.db
          JWT_SECRET: ci-only-jwt-secret-that-is-long-and-not-production
          MEDICAL_ENCRYPTION_KEY: ci-only-medical-key-that-is-long-and-not-production
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: |
          cd backend
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm test

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

  build-docker-images:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false # Set to true and configure Docker Hub/GitHub Container Registry login to push
          tags: alshifa-cms-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false # Set to true and configure Docker Hub/GitHub Container Registry login to push
          tags: alshifa-cms-frontend:latest
