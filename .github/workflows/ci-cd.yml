name: Clinic Management System CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/workflows/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Lint and Test Backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          # Add backend tests here if applicable (e.g., npm test)

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  build-docker-images:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false # Set to true and configure Docker Hub/GitHub Container Registry login to push
          tags: alshifa-cms-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false # Set to true and configure Docker Hub/GitHub Container Registry login to push
          tags: alshifa-cms-frontend:latest
