name: Clinic Management System CI/CD

on:
  push:
    branches: [ main, redesign, fix/audit-issues ]
  pull_request:
    branches: [ main, redesign ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      clinic-test-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinic_test
          POSTGRES_USER: clinic_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U clinic_test -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install and Generate Backend
        env:
          NODE_ENV: test
        run: |
          cd backend
          npm ci
          npx prisma generate

      - name: Build NestJS Backend
        run: |
          cd backend
          npm run build:nest

      - name: Test Backend
        env:
          NODE_ENV: test
          TEST_REPORT_PATH: ${{ runner.temp }}/backend-test-results.json
          TEST_DATABASE_URL: postgresql://clinic_test@127.0.0.1:5433/clinic_test
          JWT_SECRET: ci-only-jwt-secret-that-is-long-and-not-production
          MEDICAL_ENCRYPTION_KEY: ci-only-medical-key-that-is-long-and-not-production
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          VERIFICATION_PROVIDER: development
          NOTIFICATIONS_DISABLED: 'true'
          PHONE_DEFAULT_COUNTRY: RW
        run: |
          cd backend
          npm test

      - name: Test, Lint and Build Frontend
        run: |
          cd frontend
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Upload Backend Test Manifest and Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/backend-test-results.json
          if-no-files-found: warn

  build-docker-images:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false # Set to true and configure Docker Hub/GitHub Container Registry login to push
          tags: alshifa-cms-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false # Set to true and configure Docker Hub/GitHub Container Registry login to push
          tags: alshifa-cms-frontend:latest

  deploy-render:
    name: Request production deploys on Render
    needs: [test-and-lint, build-docker-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - name: Request deploys for the tested main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          latest_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$GITHUB_SHA" != "$latest_main" ]]; then
            echo "A newer commit is on main. Its workflow will handle deployment if its checks pass."
            exit 0
          fi

          hook_pattern='^https://api\.render\.com/deploy/(srv-[a-zA-Z0-9]+)\?key=[a-zA-Z0-9_-]+$'
          if [[ ! "$RENDER_API_DEPLOY_HOOK" =~ $hook_pattern ]]; then
            echo "::error::Set RENDER_API_DEPLOY_HOOK to the API service's Render deploy hook in the production environment."
            exit 1
          fi
          api_service_id="${BASH_REMATCH[1]}"
          if [[ ! "$RENDER_FRONTEND_DEPLOY_HOOK" =~ $hook_pattern ]]; then
            echo "::error::Set RENDER_FRONTEND_DEPLOY_HOOK to the frontend service's Render deploy hook in the production environment."
            exit 1
          fi
          if [[ "$api_service_id" == "${BASH_REMATCH[1]}" ]]; then
            echo "::error::The API and frontend deploy hooks must target different Render services."
            exit 1
          fi

          request_deploy() {
            local service="$1" hook="$2" status
            if ! status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --globoff --connect-timeout 10 --max-time 30 --request POST \
                "${hook}&ref=${GITHUB_SHA}"); then
              echo "::error::Could not reach the Render deploy hook for $service."
              return 1
            fi
            case "$status" in
              200|202) echo "Render accepted the $service deploy request for $GITHUB_SHA." ;;
              *) echo "::error::Render rejected the $service deploy request (HTTP $status)."; return 1 ;;
            esac
          }

          request_deploy API "$RENDER_API_DEPLOY_HOOK"
          request_deploy frontend "$RENDER_FRONTEND_DEPLOY_HOOK"
