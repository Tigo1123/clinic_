name: clinic-lan-foundation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - lan-postgres-data:/var/lib/postgresql/data
    networks:
      - lan-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: &lan-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  database-bootstrap:
    profiles: ["database-bootstrap"]
    build:
      context: .
      dockerfile: deploy/lan/Dockerfile.bootstrap
    environment:
      POSTGRES_ADMIN_CONNECTION: ${POSTGRES_ADMIN_CONNECTION:?POSTGRES_ADMIN_CONNECTION is required}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LAN_DATABASE_NAME: ${LAN_DATABASE_NAME:?LAN_DATABASE_NAME is required}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      SCHEMA_OWNER_ROLE: ${SCHEMA_OWNER_ROLE:?SCHEMA_OWNER_ROLE is required}
      MIGRATION_LOGIN_ROLE: ${MIGRATION_LOGIN_ROLE:?MIGRATION_LOGIN_ROLE is required}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?MIGRATION_DATABASE_PASSWORD is required}
      RUNTIME_DATABASE_ROLE: ${RUNTIME_DATABASE_ROLE:?RUNTIME_DATABASE_ROLE is required}
      RUNTIME_LOGIN_ROLE: ${RUNTIME_LOGIN_ROLE:?RUNTIME_LOGIN_ROLE is required}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?RUNTIME_DATABASE_PASSWORD is required}
      BACKUP_DATABASE_ROLE: ${BACKUP_DATABASE_ROLE:?BACKUP_DATABASE_ROLE is required}
      BACKUP_DATABASE_USER: ${BACKUP_DATABASE_USER:?BACKUP_DATABASE_USER is required}
      BACKUP_DATABASE_PASSWORD: ${BACKUP_DATABASE_PASSWORD:?BACKUP_DATABASE_PASSWORD is required}
      CONFIRM_LAN_DATABASE_BOOTSTRAP: ${CONFIRM_LAN_DATABASE_BOOTSTRAP:?CONFIRM_LAN_DATABASE_BOOTSTRAP is required}
    networks:
      - lan-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  first-admin:
    profiles: ["first-admin"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "scripts/provision-first-admin.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LAN_DATABASE_NAME: ${LAN_DATABASE_NAME:?LAN_DATABASE_NAME is required}
      RUNTIME_LOGIN_ROLE: ${RUNTIME_LOGIN_ROLE:?RUNTIME_LOGIN_ROLE is required}
      CONFIRM_FIRST_ADMIN_DATABASE: ${CONFIRM_FIRST_ADMIN_DATABASE:?CONFIRM_FIRST_ADMIN_DATABASE is required}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:?FIRST_ADMIN_USERNAME is required}
      FIRST_ADMIN_PREFERRED_LANGUAGE: ${FIRST_ADMIN_PREFERRED_LANGUAGE:-en}
      FIRST_ADMIN_PASSWORD_FILE: /run/secrets/first-admin-password
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    volumes:
      - ${FIRST_ADMIN_PASSWORD_SOURCE_FILE:?FIRST_ADMIN_PASSWORD_SOURCE_FILE is required}:/run/secrets/first-admin-password:ro,Z
    networks:
      - lan-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backup:
    profiles: ["backup"]
    # The one-shot tool needs read access to upload files owned by the backend
    # and write access to the separately protected host backup directory.
    user: "${BACKUP_CONTAINER_UID:-0}:${BACKUP_CONTAINER_GID:-0}"
    build:
      context: .
      dockerfile: deploy/lan/Dockerfile.backup
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${BACKUP_DATABASE_NAME:-}
      PGUSER: ${BACKUP_DATABASE_USER:-}
      PGPASSWORD: ${BACKUP_DATABASE_PASSWORD:-}
      BACKUP_OUTPUT_DIR: /backups
      UPLOADS_DIR: /uploads
      BACKUP_GPG_PUBLIC_KEY_FILE: /run/backup-recipient.asc
      BACKUP_GPG_RECIPIENT: ${BACKUP_GPG_RECIPIENT:-}
      BACKUP_GPG_SIGNING_PRIVATE_KEY_FILE: /run/backup-signing-private.asc
      BACKUP_GPG_SIGNING_FINGERPRINT: ${BACKUP_GPG_SIGNING_FINGERPRINT:-}
      BACKUP_QUIESCE_CONFIRMED: ${BACKUP_QUIESCE_CONFIRMED:-false}
      APPLICATION_REVISION: ${APPLICATION_REVISION:-unknown}
    volumes:
      - lan-uploads-data:/uploads:ro
      - ${BACKUP_OUTPUT_DIR:-./.local/lan-backups}:/backups
      - ${BACKUP_GPG_PUBLIC_KEY_FILE:-./deploy/lan/keys/UNCONFIGURED.asc}:/run/backup-recipient.asc:ro
      - ${BACKUP_GPG_SIGNING_PRIVATE_KEY_FILE:-./deploy/lan/keys/UNCONFIGURED-SIGNING-PRIVATE.asc}:/run/backup-signing-private.asc:ro
    networks:
      - lan-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CLINIC_TIME_ZONE: ${CLINIC_TIME_ZONE:?CLINIC_TIME_ZONE is required}
      PORT: "5000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SOCKET_REVOCATION_DATABASE_URL: ${SOCKET_REVOCATION_DATABASE_URL:?SOCKET_REVOCATION_DATABASE_URL is required}
      SOCKET_REVOCATION_RECONCILE_MS: ${SOCKET_REVOCATION_RECONCILE_MS:-10000}
      SOCKET_REVOCATION_UNHEALTHY_GRACE_MS: ${SOCKET_REVOCATION_UNHEALTHY_GRACE_MS:-15000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-clinic-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-clinic-application}
      MEDICAL_ENCRYPTION_KEY: ${MEDICAL_ENCRYPTION_KEY:?MEDICAL_ENCRYPTION_KEY is required}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      MFA_TOTP_ISSUER: ${MFA_TOTP_ISSUER:-Clinic Management System}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      TRUST_PROXY: "true"
      VERIFICATION_PROVIDER: ${VERIFICATION_PROVIDER:-disabled}
      NOTIFICATIONS_DISABLED: ${NOTIFICATIONS_DISABLED:-true}
      PHONE_DEFAULT_COUNTRY: ${PHONE_DEFAULT_COUNTRY:-SD}
      DEFAULT_STATE_ID: ${DEFAULT_STATE_ID:-1}
      PATIENT_CANCELLATION_CUTOFF_HOURS: ${PATIENT_CANCELLATION_CUTOFF_HOURS:-2}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_REGISTRATION_MAX: ${RATE_LIMIT_REGISTRATION_MAX:-10}
      RATE_LIMIT_VERIFICATION_MAX: ${RATE_LIMIT_VERIFICATION_MAX:-10}
      RATE_LIMIT_CLAIM_MAX: ${RATE_LIMIT_CLAIM_MAX:-10}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    volumes:
      - lan-uploads-data:/app/uploads
    networks:
      - lan-app
      - lan-data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *lan-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CLINIC_TIME_ZONE: ${VITE_CLINIC_TIME_ZONE:-Africa/Khartoum}
    ports:
      - "${LAN_BIND_IP:?LAN_BIND_IP is required}:443:443"
    volumes:
      - ./deploy/lan/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LAN_TLS_CERT_FILE:?LAN_TLS_CERT_FILE is required}:/etc/nginx/tls/server.crt:ro,Z
      - ${LAN_TLS_KEY_FILE:?LAN_TLS_KEY_FILE is required}:/etc/nginx/tls/server.key:ro,Z
    networks:
      - lan-edge
      - lan-app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *lan-logging

networks:
  lan-edge:
  lan-app:
    internal: true
  lan-data:
    internal: true

volumes:
  lan-postgres-data:
  lan-uploads-data:
